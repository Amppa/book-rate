<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="以中文書名尋找 Open Library 作品、版本與評分。" />
    <title>書籍版本與評分查詢</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <p class="eyebrow">BOOK SCORE · MVP</p>
        <h1>先鎖定作品，再比較評分</h1>
        <p class="lede">輸入中英文書名或 ISBN，先選擇正確的 Open Library Work，再取得版本與公開評分。</p>
      </header>

      <form id="search-form" class="search-form">
        <label for="title">書名或 ISBN</label>
        <div class="search-row">
          <input id="title" name="title" type="search" placeholder="例如：原子習慣、Atomic Habits、9780735211292" required autofocus />
          <button type="submit">尋找作品</button>
        </div>
        <p class="hint">第 1 步會列出最相關的 10 個作品，請選擇你要鎖定的那一本。</p>
      </form>

      <section id="history-section" class="history-section" hidden>
        <p>最近查詢</p><div id="history-list" class="history-list"></div>
      </section>

      <section id="status" class="status" aria-live="polite">請輸入書名開始查詢。</section>
      <section id="candidate-section" hidden aria-live="polite">
        <div class="section-heading"><p class="eyebrow">第 1 步</p><h2>選擇要鎖定的作品</h2></div>
        <div id="candidate-list" class="candidate-list"></div>
      </section>
      <section id="results" aria-live="polite">
        <div id="details-heading" class="section-heading" hidden><p class="eyebrow">第 2 步</p><h2>版本與評分</h2></div>
        <div class="table-wrap" hidden>
          <table>
            <thead><tr><th>書名</th><th>原作者</th><th>Work／版本</th><th>Open Library 分數／人數</th><th>Google Books 分數／人數</th></tr></thead>
            <tbody id="result-body"></tbody>
          </table>
        </div>
      </section>
    </main>
    <template id="result-template">
      <tr class="work-row">
        <td class="work-title"></td>
        <td class="author"></td>
        <td><a class="work-link" target="_blank" rel="noreferrer">Open Library Work ↗</a><details>
          <summary>版本 <span class="edition-count"></span></summary>
          <div class="edition-note"></div>
          <div class="edition-list"></div>
        </details></td>
        <td><strong class="ol-score"></strong><small class="ol-count"></small></td>
        <td><strong class="gb-score"></strong><small class="gb-count"></small></td>
      </tr>
    </template>
    <template id="candidate-template">
      <article class="candidate-card">
        <div><h3 class="candidate-title"></h3><p class="candidate-author"></p><p class="candidate-meta"></p></div>
        <button type="button" class="select-work">鎖定這本書</button>
      </article>
    </template>
    <script src="./app.js"></script>
  </body>
</html>
