<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="以中文書名尋找 Open Library 作品、版本與評分。" />
  <title>書譽 - 跨平臺書籍評價查詢</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="page-shell">
    <details class="settings-details">
      <summary>⚙️設定</summary>
      <div class="settings-content">
        <!-- 1. 清除快取 -->
        <div class="setting-item">
          <label>1. 系統快取</label>
          <button type="button" id="clear-cache-btn" class="btn-secondary btn-full">清除本地快取</button>
        </div>

        <!-- 2. Google API Key 設定 -->
        <div class="setting-item">
          <label for="google-api-key">2. Google Books API Key</label>
          <div class="api-key-input-row">
            <input type="password" id="google-api-key" placeholder="輸入 API 金鑰 (例如 AIzaSy...)" />
            <div class="api-key-actions">
              <button type="button" id="save-api-key-btn">儲存</button>
              <button type="button" id="clear-api-key-btn" class="btn-secondary">清除</button>
            </div>
          </div>
        </div>
      </div>
    </details>

    <header>
      <p class="eyebrow">BOOK RATE · MVP</p>
      <h1>書譽<span class="subtitle"> 跨平台書籍風評查詢</span></h1>
      <p class="lede">輸入書名或 ISBN，選擇書籍，顯示網友評分。</p>
    </header>
    <hr class="header-line" />

    <div class="wizard-container">
      <div class="wizard-track" id="wizard-track">

        <!-- 步驟 1 面板 -->
        <div class="wizard-step active" id="step-1">
          <div class="section-heading">
            <h2><small class="step-num">第 1 步</small>搜尋書籍</h2>
          </div>
          <form id="search-form" class="search-form">
            <label for="title">輸入書名或 ISBN</label>
            <div class="search-row">
              <input id="title" name="title" type="search" placeholder="例如：原子習慣、Atomic Habits、9780735211292" required
                autofocus />
              <button type="submit">Search</button>
            </div>
            <div class="history-presets-row">
              <section id="history-section" class="history-section" hidden>
                <p>最近查詢：</p>
                <div id="history-list" class="history-list"></div>
              </section>
              <button type="button" id="open-presets-btn" class="presets-link-btn">測試</button>
            </div>
          </form>
        </div>

        <!-- 步驟 2 面板 -->
        <div class="wizard-step" id="step-2">
          <div class="step-header">
            <button type="button" id="btn-prev-to-1" class="btn-secondary">← 上一步</button>
            <div id="candidate-heading" class="section-heading" hidden>
              <h2><small class="step-num">第 2 步</small>選取書籍</h2>
            </div>
          </div>
          <div id="step-2-status" class="status" aria-live="polite"></div>
          <section id="candidate-section" hidden aria-live="polite">
            <div class="step2-split-layout">
              <!-- 左欄：搜尋資料庫切換、結果列表、手動搜尋 -->
              <div class="step2-left-panel">
                <!-- 搜尋資料庫切換按鈕 -->
                <div class="step2-block" id="section-title-provider-tabs">
                  <div class="other-title-providers-buttons" id="title-provider-tabs-container"></div>
                </div>

                <!-- 線上資料庫搜尋結果列表 -->
                <div class="step2-block">
                  <div id="candidate-list" class="candidate-list"></div>
                  <div id="pagination-controls" class="pagination-controls" hidden>
                    <button type="button" id="prev-page-btn" class="btn-secondary">上一頁</button>
                    <span id="page-indicator">第 1 頁</span>
                    <button type="button" id="next-page-btn" class="btn-secondary">下一頁</button>
                  </div>
                </div>

                <!-- 手動搜尋 ISBN -->
                <div class="step2-block search-provider-note" id="section-manual-search">
                  <h3 class="step2-block-title">或 手動搜尋 ISBN</h3>
                  <p>
                    需由使用者手動複製ISBN：
                    <a id="manual-isbndb-link" href="https://isbndb.com/" target="_blank"
                      rel="noopener noreferrer">ISBNdb</a>、
                    <a id="manual-isbnsearch-link" href="https://isbnsearch.org/" target="_blank"
                      rel="noopener noreferrer">ISBNsearch</a>、
                    <a id="manual-amazon-link" href="https://www.amazon.com/s?i=stripbooks" target="_blank"
                      rel="noopener noreferrer">Amazon Books</a>
                  </p>
                </div>
              </div>

              <!-- 右欄：Book Metadata 面板 -->
              <aside class="step2-right-panel">
                <div class="book-metadata-card">
                  <div class="bm-card-header">
                    <h3 class="bm-card-title">Book Metadata</h3>
                    <button type="button" id="btn-confirm-to-3" class="btn-confirm-next" title="確認並進入 Step 3">➜ Step
                      3</button>
                  </div>
                  <p class="bm-card-subtitle">按 Choose 填入資料，確認後點擊右上角按鈕前往 Step 3</p>

                  <div class="bm-field-group">
                    <label for="bm-search-name">搜尋名稱 (User input title)</label>
                    <input type="text" id="bm-search-name" class="bm-input" placeholder="" />
                  </div>

                  <div class="bm-field-group">
                    <label for="bm-title">建議書名列表 (Titles from Provider)</label>
                    <textarea id="bm-title" class="bm-input" placeholder=""></textarea>
                  </div>

                  <div class="bm-field-group">
                    <label for="bm-title-zh">建議書名列表 (中文)</label>
                    <textarea id="bm-title-zh" class="bm-input" placeholder="若書名有CJK語言，則會被帶入此處"></textarea>
                  </div>

                  <div class="bm-field-group">
                    <label for="bm-author">作者</label>
                    <textarea id="bm-author" class="bm-input" placeholder=""></textarea>
                  </div>

                  <div class="bm-field-group">
                    <label for="bm-publish-date">出版日期</label>
                    <input type="text" id="bm-publish-date" class="bm-input" placeholder="(暫時未支援搜尋)" />
                  </div>

                  <div class="bm-field-group">
                    <label for="bm-isbn">ISBN</label>
                    <textarea id="bm-isbn" class="bm-input" placeholder=""></textarea>
                  </div>
                </div>
              </aside>
            </div>
          </section>
        </div>

        <!-- 步驟 3 面板 -->
        <div class="wizard-step" id="step-3">
          <div class="step-header">
            <button type="button" id="btn-prev-to-2" class="btn-secondary">← 上一步</button>
            <div id="details-heading" class="section-heading" hidden>
              <h2><small class="step-num">第 3 步</small>書籍評分</h2>
            </div>
          </div>
          <div id="step-3-status" class="status" aria-live="polite"></div>
          <section id="results" aria-live="polite">
            <div class="step3-metadata-card" id="step3-metadata-card" style="margin-bottom: var(--space-4);">
              <h3 class="bm-card-title" style="margin-bottom: var(--space-2); font-size: var(--fs-md);">Book Metadata
              </h3>
              <div class="step3-metadata-grid">
                <div class="meta-col">
                  <div class="bm-field-group">
                    <label for="s3-search-name">搜尋名稱 (User input title)</label>
                    <input type="text" id="s3-search-name" class="bm-input" readonly />
                  </div>
                  <div class="bm-field-group" style="margin-top: var(--space-2);">
                    <label for="s3-author">作者列表</label>
                    <textarea id="s3-author" class="bm-input" readonly></textarea>
                  </div>
                  <div class="bm-field-group" style="margin-top: var(--space-2);">
                    <label for="s3-publish-date">出版日期</label>
                    <input type="text" id="s3-publish-date" class="bm-input" readonly />
                  </div>
                </div>
                <div class="meta-col">
                  <div class="bm-field-group">
                    <label for="s3-title">書名列表</label>
                    <textarea id="s3-title" class="bm-input" readonly></textarea>
                  </div>
                  <div class="bm-field-group" style="margin-top: var(--space-2);">
                    <label for="s3-title-zh">書名列表 (亞洲)</label>
                    <textarea id="s3-title-zh" class="bm-input" readonly></textarea>
                  </div>
                </div>
                <div class="meta-col">
                  <div class="bm-field-group" style="height: 100%;">
                    <label for="s3-isbn">ISBN 列表</label>
                    <textarea id="s3-isbn" class="bm-input" readonly
                      style="height: calc(100% - 1.5rem); min-height: 120px;"></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="score-display-toggles" id="score-toggle-bar">
              <span class="toggle-title">來源：</span>
            </div>
            <div class="table-wrap" hidden>
              <table>
                <thead>
                  <tr id="table-header-row"></tr>
                  <tr id="score-strategy-row" class="thead-strategy-row"></tr>
                </thead>
                <tbody id="result-body"></tbody>
              </table>
            </div>
          </section>
        </div>

      </div>
    </div>
    <footer class="app-footer search-provider-note">
      <p>
        <span id="open-platform-info-btn" class="info-text-link" role="button" tabindex="0">[書籍資料庫比較]</span>
      </p>
      <p>
        GitHub：
        <a href="https://github.com/Amppa/book-rate" target="_blank" rel="noopener noreferrer">Amppa/book-rate ↗</a>
      </p>
    </footer>
  </main>

  <template id="candidate-template">
    <article class="candidate-card">
      <div>
        <h3 class="candidate-title"></h3>
        <div style="display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-1);">
          <a class="candidate-meta candidate-link" target="_blank" rel="noopener noreferrer" style="margin-top: 0;"></a>
          <span class="candidate-status-tag" hidden></span>
        </div>
      </div>
      <button type="button" class="select-work">Choose</button>
    </article>
  </template>

  <!-- 測試預設值 Modal -->
  <div id="presets-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3>測試</h3>
        <button type="button" id="close-presets-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <table class="presets-table">
          <thead>
            <tr>
              <th>書名</th>
              <th>ISBN</th>
            </tr>
          </thead>
          <tbody id="presets-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 版本列表 Modal -->
  <div id="editions-modal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="editions-modal-title">版本列表</h3>
        <button type="button" id="close-editions-btn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="editions-modal-note" class="edition-note" style="margin-bottom: var(--space-3);"></div>
        <div id="editions-modal-list" class="edition-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js?v=1.0.17"></script>
</body>

</html>
