<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="以中文書名尋找 Open Library 作品、版本與評分。" />
  <title>BookRate 書籍評價查詢</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="page-shell">
    <details class="settings-details">
      <summary>⚙️設定</summary>
      <div class="settings-content">
        <!-- 1. 清除快取 -->
        <div class="setting-item">
          <label>1. 系統快取</label>
          <button type="button" id="clear-cache-btn" class="btn-secondary btn-full">清除本地快取</button>
        </div>

        <!-- 2. 書名搜尋引擎 -->
        <div class="setting-item">
          <label>2. 書名搜尋引擎</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="engine-ol" />
              <span>Open Library</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="engine-gb" />
              <span>Google Books</span>
            </label>
          </div>
        </div>

        <!-- 3. Google API Key 設定 -->
        <div class="setting-item">
          <label for="google-api-key">3. Google Books API Key</label>
          <div class="api-key-input-row">
            <input type="password" id="google-api-key" placeholder="輸入 API 金鑰 (例如 AIzaSy...)" />
            <div class="api-key-actions">
              <button type="button" id="save-api-key-btn">儲存</button>
              <button type="button" id="clear-api-key-btn" class="btn-secondary">清除</button>
            </div>
          </div>
        </div>

        <!-- 4. 顯示哪些分數 -->
        <div class="setting-item">
          <label>4. 分數顯示</label>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="score-ol" />
              <span>Open Library</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="score-gb" />
              <span>Google Books</span>
            </label>
          </div>
        </div>
      </div>
    </details>

    <header>
      <p class="eyebrow">BOOK RATE · MVP</p>
      <h1>書譽<span class="subtitle">查詢書籍風評</span></h1>
      <p class="lede">輸入書名或 ISBN，確認要選擇書籍，顯示查尋網友評分。</p>
    </header>
    <hr class="header-line" />

    <div class="wizard-container">
      <div class="wizard-track" id="wizard-track">

        <!-- 步驟 1 面板 -->
        <div class="wizard-step" id="step-1">
          <div class="section-heading">
            <h2><small class="step-num">第 1 步</small>搜尋書籍</h2>
          </div>
          <form id="search-form" class="search-form">
            <label for="title">書名或 ISBN</label>
            <div class="search-row">
              <input id="title" name="title" type="search" placeholder="例如：原子習慣、Atomic Habits、9780735211292" required
                autofocus />
              <button type="submit">尋找</button>
            </div>
            <section id="history-section" class="history-section" hidden>
              <p>最近查詢：</p>
              <div id="history-list" class="history-list"></div>
            </section>
          </form>
        </div>

        <!-- 步驟 2 面板 -->
        <div class="wizard-step" id="step-2">
          <div class="step-header">
            <button type="button" id="btn-prev-to-1" class="btn-secondary">← 上一步</button>
            <div id="candidate-heading" class="section-heading" hidden>
              <h2><small class="step-num">第 2 步</small>選取書籍</h2>
            </div>
          </div>
          <div id="step-2-status" class="status" aria-live="polite"></div>
          <section id="candidate-section" hidden aria-live="polite">
            <div id="candidate-list" class="candidate-list"></div>
            <div id="pagination-controls" class="pagination-controls" hidden>
              <button type="button" id="prev-page-btn" class="btn-secondary">上一頁</button>
              <span id="page-indicator">第 1 頁</span>
              <button type="button" id="next-page-btn">下一頁</button>
            </div>
          </section>
        </div>

        <!-- 步驟 3 面板 -->
        <div class="wizard-step" id="step-3">
          <div class="step-header">
            <button type="button" id="btn-prev-to-2" class="btn-secondary">← 上一步</button>
            <div id="details-heading" class="section-heading" hidden>
              <h2><small class="step-num">第 3 步</small>版本與評分</h2>
            </div>
          </div>
          <div id="step-3-status" class="status" aria-live="polite"></div>
          <section id="results" aria-live="polite">
            <div class="table-wrap" hidden>
              <table>
                <thead>
                  <tr>
                    <th>書名</th>
                    <th>原作者</th>
                    <th>Work／版本</th>
                    <th>Open Library 評價</th>
                    <th>Google Books 評價</th>
                  </tr>
                </thead>
                <tbody id="result-body"></tbody>
              </table>
            </div>
          </section>
        </div>

      </div>
    </div>
  </main>
  <template id="result-template">
    <tr class="work-row">
      <td class="work-title"></td>
      <td class="author"></td>
      <td><a class="work-link" target="_blank" rel="noreferrer">Open Library Work ↗</a>
        <details>
          <summary><span class="edition-count"></span></summary>
          <div class="edition-note"></div>
          <div class="edition-list"></div>
        </details>
      </td>
      <td><strong class="ol-rate"></strong><small class="ol-count"></small></td>
      <td><strong class="gb-rate"></strong><small class="gb-count"></small></td>
    </tr>
  </template>
  <template id="candidate-template">
    <article class="candidate-card">
      <div>
        <h3 class="candidate-title"></h3>
        <p class="candidate-meta"></p>
      </div>
      <button type="button" class="select-work">選這本書</button>
    </article>
  </template>
  <script src="./app.js"></script>
</body>

</html>
